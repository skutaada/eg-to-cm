<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPTCG Decklist Converter</title>
<meta name="description" content="Convert One Piece TCG decklists from Egman Events or gumgum.gg format to Cardmarket wants list import format.">
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 960px; margin: 0 auto; padding: 24px 16px; line-height: 1.5; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  p { margin: 0 0 20px; font-size: .9rem; opacity: .75; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; }
  textarea { width: 100%; box-sizing: border-box; height: 380px; padding: 8px; resize: vertical; font: 13px/1.5 ui-monospace, monospace; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 8px; font-size: .85rem; }
  .bar label { display: inline; font-weight: normal; margin: 0; }
  button { font: inherit; padding: 4px 14px; cursor: pointer; }
  #status { opacity: .75; }
  #notes { color: #d33; font-size: .85rem; white-space: pre-wrap; margin-top: 8px; }
</style>
</head>
<body>
<h1>Egman / gumgum.gg → Cardmarket</h1>
<p>Paste a One Piece TCG decklist exported from Egman Events or gumgum.gg. Paste the result into a
  <a href="https://www.cardmarket.com/en/OnePiece/Wants" target="_blank" rel="noopener">Cardmarket wants list</a>.</p>

<div class="grid">
  <div>
    <label for="input">Decklist</label>
    <textarea id="input" spellcheck="false" placeholder="1 OP01-001 Roronoa Zoro&#10;4 OP01-016 Nami&#10;&#10;or&#10;&#10;1xOP01-001&#10;4xOP01-016"></textarea>
    <div class="bar">
      <label><input type="checkbox" id="side"> Include "Other Cards"</label>
    </div>
  </div>
  <div>
    <label for="output">Cardmarket import</label>
    <textarea id="output" spellcheck="false" readonly></textarea>
    <div class="bar">
      <button id="copy">Copy</button>
      <span id="status"></span>
    </div>
  </div>
</div>
<div id="notes"></div>

<script>
  // "4 OP01-016 Nami" (Egman), also "4xOP01-016" (gumgum.gg, OPTCG Sim). Variant suffixes on the code are dropped.
  const LINE = /^(\d+)\s*x?\s*([A-Z]+\d*-\d+)\S*\s*(.*)$/i;

  // Official English card names by code, for decklists that only list codes.
  const CARDS_URL = "https://raw.githubusercontent.com/buhbbl/punk-records/main/english/index/cards_by_id.json";
  let names = null;    // Map of code → name, once loaded
  let lookup = "idle"; // "loading" | "done" | "failed"

  function convert(text, includeSide, names) {
    const cards = new Map();
    const skipped = [];
    let side = false;
    for (const raw of text.split(/\r?\n/)) {
      const line = raw.trim();
      if (!line) continue;
      if (/^other cards:?$/i.test(line)) { side = true; continue; }
      const m = line.match(LINE);
      if (!m) { skipped.push(line); continue; }
      if (side && !includeSide) continue;
      const code = m[2].toUpperCase();
      const card = cards.get(code) || { count: 0, name: "" };
      card.count += Number(m[1]);
      card.name ||= m[3];
      cards.set(code, card);
    }
    const unnamed = [];
    const lines = [...cards].map(([code, c]) => {
      // Cardmarket reads "(...)" as a version, so "Mr.3(Galdino)" becomes "Mr.3 Galdino".
      const name = (c.name || names?.get(code) || "").replace(/\(([^)]*)\)/g, " $1 ").replace(/\s+/g, " ").trim();
      if (!name) unnamed.push(code);
      return `${c.count}x ${name ? name + " " : ""}${code}`;
    });
    const total = [...cards.values()].reduce((sum, c) => sum + c.count, 0);
    return { output: lines.join("\n"), total, unique: cards.size, skipped, unnamed };
  }

  const $ = (id) => document.getElementById(id);

  // The card data escapes names as HTML ("Ace &amp; Newgate").
  const decoder = document.createElement("textarea");
  const decodeHtml = (s) => { decoder.innerHTML = s; return decoder.value; };

  function loadNames() {
    lookup = "loading";
    fetch(CARDS_URL)
      .then((res) => { if (!res.ok) throw new Error(res.statusText); return res.json(); })
      .then((data) => {
        names = new Map(Object.entries(data).map(([code, card]) => [code, decodeHtml(card.name)]));
        lookup = "done";
      })
      .catch(() => { lookup = "failed"; })
      .finally(update);
  }

  function update() {
    const r = convert($("input").value, $("side").checked, names);
    if (r.unnamed.length && lookup === "idle") loadNames();
    $("output").value = r.output;
    const loading = r.unnamed.length && lookup === "loading" ? " · looking up card names…" : "";
    $("status").textContent = r.total ? `${r.total} cards, ${r.unique} unique${loading}` : "";
    const notes = [];
    if (r.skipped.length) notes.push(`Couldn't read:\n${r.skipped.join("\n")}`);
    if (r.unnamed.length && lookup === "failed") notes.push("Couldn't load card names. Reload the page to try again.");
    if (r.unnamed.length && lookup === "done") notes.push(`No card name found for:\n${r.unnamed.join("\n")}`);
    $("notes").textContent = notes.join("\n\n");
  }

  $("input").addEventListener("input", update);
  $("side").addEventListener("change", update);
  $("copy").addEventListener("click", async () => {
    const out = $("output");
    try { await navigator.clipboard.writeText(out.value); }
    catch { out.select(); document.execCommand("copy"); }
    $("copy").textContent = "Copied";
    setTimeout(() => $("copy").textContent = "Copy", 1500);
  });
</script>
</body>
</html>
